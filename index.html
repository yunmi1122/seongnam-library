<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>성남시 도서관 대출가능 검색</title>
<style>
:root{--bg:#f7f5f0;--surface:#fff;--surface2:#f0ede6;--border:#e2ddd4;--text:#1a1814;--text2:#6b6560;--text3:#a09a93;--green:#2d7a5f;--green-bg:#eaf4ee;--amber:#c47c1a;--amber-bg:#fef5e4;--red:#c0392b;--red-bg:#fdecea;--blue:#2563a8;--blue-bg:#eef4fd;--accent:#3d6b4f;--radius:12px;--radius-sm:8px}*{box-sizing:border-box;margin:0;padding:0}body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans KR',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;font-size:15px;line-height:1.6}.header{background:var(--surface);border-bottom:1px solid var(--border);padding:0 18px;display:flex;align-items:center;gap:12px;height:58px;position:sticky;top:0;z-index:100}.header-icon{width:34px;height:34px;background:var(--accent);border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:17px}.header-title{font-size:16px;font-weight:700;letter-spacing:-.3px}.header-sub{font-size:11px;color:var(--text3);margin-left:auto}.main{max-width:860px;margin:0 auto;padding:20px 16px 56px}.key-strip{background:var(--green-bg);border:1px solid #d0eada;border-radius:var(--radius);padding:12px 16px;margin-bottom:16px;color:var(--green);font-size:13px}.tabs{display:flex;gap:6px;margin-bottom:18px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:6px}.tab{flex:1;padding:10px 8px;border-radius:var(--radius-sm);border:none;background:transparent;font-size:13px;font-weight:600;color:var(--text2);cursor:pointer}.tab.active{background:var(--accent);color:#fff}.panel{display:none}.panel.active{display:block}.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:18px 18px;margin-bottom:14px}.card-label{font-size:12px;font-weight:700;color:var(--text3);margin-bottom:10px;text-transform:uppercase;letter-spacing:.5px}textarea{width:100%;border:1px solid var(--border);border-radius:var(--radius-sm);padding:12px 14px;font-size:14px;font-family:inherit;color:var(--text);background:var(--bg);resize:vertical;min-height:120px;line-height:1.8;outline:none}textarea:focus{border-color:var(--accent)}.input-hint{font-size:12px;color:var(--text3);margin-top:6px}.btn-primary{background:var(--accent);color:#fff;border:none;border-radius:var(--radius-sm);padding:11px 22px;font-size:14px;font-weight:600;font-family:inherit;cursor:pointer}.btn-primary:disabled{opacity:.35}.btn-ghost{background:transparent;color:var(--text2);border:1px solid var(--border);border-radius:var(--radius-sm);padding:11px 16px;font-size:14px;font-family:inherit}.btn-row{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}.pill{padding:6px 14px;border-radius:20px;border:1px solid var(--border);background:var(--surface);font-size:13px;color:var(--text2);cursor:pointer;font-family:inherit}.pill.active{background:var(--accent);color:#fff;border-color:var(--accent)}.age-selector{display:flex;gap:6px;margin-bottom:16px;flex-wrap:wrap}.gender-toggle{display:flex;background:var(--surface2);border-radius:var(--radius-sm);padding:4px;gap:4px;width:fit-content;margin-bottom:16px}.gender-btn{padding:7px 18px;border:none;border-radius:6px;font-size:13px;font-weight:600;font-family:inherit;cursor:pointer;background:transparent;color:var(--text2)}.gender-btn.active{background:var(--surface);color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.08)}.notice{background:var(--blue-bg);border:1px solid #bdd4f0;border-radius:var(--radius-sm);padding:10px 14px;font-size:13px;color:var(--blue);margin-bottom:14px}.loading{text-align:center;padding:36px 16px;color:var(--text2);font-size:14px}.spinner{width:28px;height:28px;border:3px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .7s linear infinite;margin:0 auto 14px}@keyframes spin{to{transform:rotate(360deg)}}.step-badge{display:inline-flex;font-size:11px;font-weight:700;color:var(--text3);background:var(--surface2);border:1px solid var(--border);border-radius:20px;padding:3px 10px;margin-bottom:10px}.section-title{font-size:15px;font-weight:800;margin-bottom:12px}.confirm-card{display:flex;gap:12px;padding:12px 14px;border:1px solid var(--border);border-radius:var(--radius-sm);background:var(--surface);margin-bottom:8px}.confirm-icon{width:30px;height:30px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0;font-weight:800}.icon-ok{background:var(--green-bg);color:var(--green)}.icon-err{background:var(--red-bg);color:var(--red)}.confirm-info{flex:1;min-width:0}.confirm-title{font-size:14px;font-weight:700}.confirm-meta{font-size:12px;color:var(--text2);margin-top:2px}.isbn-badge{display:inline-block;font-size:11px;padding:1px 7px;border-radius:20px;background:var(--surface2);color:var(--text3);margin-left:6px}.tbl-wrap{overflow-x:auto;border:1px solid var(--border);border-radius:var(--radius)}table{width:100%;border-collapse:collapse;font-size:12px;min-width:600px}th{background:var(--surface2);padding:9px 8px;text-align:center;font-weight:700;color:var(--text2);border-bottom:1px solid var(--border);white-space:nowrap}th.left{text-align:left;min-width:120px;padding-left:14px}td{padding:9px 8px;text-align:center;border-bottom:1px solid var(--border);color:var(--text2)}td.left{text-align:left;font-weight:700;color:var(--text);padding-left:14px;font-size:13px}.dot-y,.dot-n{display:inline-block;width:10px;height:10px;border-radius:50%}.dot-y{background:var(--green)}.dot-n{background:var(--border)}.rank-list,.book-list{display:flex;flex-direction:column;gap:8px}.rank-row{display:flex;align-items:center;gap:12px;padding:12px 14px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm)}.rank-row.top{border-color:var(--green);background:var(--green-bg)}.rank-num{font-size:14px;font-weight:800;color:var(--text3);width:22px;text-align:center}.rank-name{font-size:14px;font-weight:700;flex:1}.rank-bar-bg{width:90px;height:6px;background:var(--surface2);border-radius:3px;overflow:hidden;flex-shrink:0}.rank-bar-fill{height:100%;background:var(--green);border-radius:3px}.rank-count{font-size:13px;color:var(--text2);white-space:nowrap;min-width:44px;text-align:right}.recommend-box{background:var(--green-bg);border:1px solid #d0eada;border-radius:var(--radius-sm);padding:14px 16px;margin-top:14px;font-size:14px;color:var(--green);font-weight:700}.err-box{background:var(--red-bg);border:1px solid #f5c6c2;border-radius:var(--radius-sm);padding:12px 16px;font-size:14px;color:var(--red);margin-top:12px}.book-item{display:flex;align-items:center;gap:12px;padding:10px 14px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm);cursor:pointer;user-select:none}.book-item.checked{background:var(--green-bg);border-color:var(--green)}.book-rank-num{font-size:13px;font-weight:800;color:var(--text3);width:20px;text-align:center}.book-rank-num.top3{color:var(--amber)}.book-item-info{flex:1;min-width:0}.book-item-title{font-size:14px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.book-item-author{font-size:12px;color:var(--text2);margin-top:1px}.check-box{width:20px;height:20px;border:1.5px solid var(--border);border-radius:5px;display:flex;align-items:center;justify-content:center}.book-item.checked .check-box{background:var(--green);border-color:var(--green);color:#fff;font-size:12px}.wish-badge{display:inline-flex;align-items:center;font-size:12px;padding:3px 10px;border-radius:20px;background:var(--amber-bg);color:var(--amber);border:1px solid #f5d9a0;font-weight:700}.result-area{margin-top:6px}@media(max-width:600px){.header-sub{display:none}.rank-bar-bg{width:54px}.tabs{gap:4px}.tab{font-size:12px;padding:9px 4px}}
</style>
</head>
<body>
<header class="header"><div class="header-icon">📚</div><div class="header-title">성남시 도서관 대출가능 검색</div><div class="header-sub">18개 도서관 · Vercel 보안 API</div></header>
<div class="main">
  <div class="key-strip">🔐 API 키는 Vercel 서버 환경변수에서 처리됩니다. 화면에 입력할 필요 없어요.</div>
  <div class="tabs"><button class="tab active" onclick="switchTab('search')">🔍<br>책 직접 검색</button><button class="tab" onclick="switchTab('kids')">🧒<br>어린이 인기도서</button><button class="tab" onclick="switchTab('adult')">👨‍👩‍👧‍👦<br>어른 인기도서</button></div>
  <div class="panel active" id="panel-search"><div class="card"><div class="card-label">찾고 싶은 책 제목 (한 줄에 하나씩, 최대 10권)</div><textarea id="bookInput" placeholder="예시&#10;아몬드&#10;마법천자문 1권&#10;해리포터와 마법사의 돌"></textarea><p class="input-hint">책 제목을 한 줄에 하나씩 입력해 주세요</p><div class="btn-row"><button class="btn-primary" id="searchBtn" onclick="startDirectSearch()">검색하기</button><button class="btn-ghost" onclick="resetSearch()">초기화</button></div></div><div class="result-area" id="searchResult"></div></div>
  <div class="panel" id="panel-kids"><div class="card"><div class="card-label">연령 선택</div><div class="age-selector"><button class="pill active" onclick="setKidsAge(this,'6,9')">6~9세</button><button class="pill" onclick="setKidsAge(this,'10,13')">10~13세</button><button class="pill" onclick="setKidsAge(this,'14,18')">14~18세</button></div><div class="notice">체크한 책을 선택하면 성남시 18개 도서관에서 지금 대출 가능한 곳만 확인할 수 있어요.</div><div id="kidsList"><div class="loading"><div class="spinner"></div>인기도서 불러오는 중...</div></div><div class="btn-row" id="kidsBtn" style="display:none"><button class="btn-primary" onclick="searchCheckedBooks('kids')">선택한 책 도서관 검색하기</button><span id="kidsCount" class="wish-badge">0권 선택</span></div></div><div class="result-area" id="kidsResult"></div></div>
  <div class="panel" id="panel-adult"><div class="card"><div class="card-label">대상 선택</div><div class="gender-toggle"><button class="gender-btn active" id="genderF" onclick="setGender('F')">엄마 (여성)</button><button class="gender-btn" id="genderM" onclick="setGender('M')">아빠 (남성)</button></div><div class="notice">체크한 책을 선택하면 성남시 18개 도서관에서 지금 대출 가능한 곳만 확인할 수 있어요.</div><div id="adultList"><div class="loading"><div class="spinner"></div>인기도서 불러오는 중...</div></div><div class="btn-row" id="adultBtn" style="display:none"><button class="btn-primary" onclick="searchCheckedBooks('adult')">선택한 책 도서관 검색하기</button><span id="adultCount" class="wish-badge">0권 선택</span></div></div><div class="result-area" id="adultResult"></div></div>
</div>
<script>
const LIBRARIES=[{name:'중앙도서관',code:'141151'},{name:'고등도서관',code:'141201'},{name:'구미도서관',code:'141252'},{name:'논골도서관',code:'141253'},{name:'무지개도서관',code:'141254'},{name:'복정도서관',code:'141255'},{name:'분당도서관',code:'141152'},{name:'서현도서관',code:'141202'},{name:'수내도서관',code:'141203'},{name:'수정도서관',code:'141256'},{name:'운중도서관',code:'141204'},{name:'위례도서관',code:'141257'},{name:'중원도서관',code:'141153'},{name:'중원어린이도서관',code:'141258'},{name:'책테마파크도서관',code:'141259'},{name:'판교도서관',code:'141205'},{name:'판교어린이도서관',code:'141260'},{name:'해오름도서관',code:'141206'}];
let kidsAge='6,9',adultGender='F',kidsBooks=[],adultBooks=[];
function switchTab(name){document.querySelectorAll('.tab').forEach((t,i)=>t.classList.toggle('active',['search','kids','adult'][i]===name));document.querySelectorAll('.panel').forEach(p=>p.classList.remove('active'));document.getElementById('panel-'+name).classList.add('active');if(name==='kids'&&kidsBooks.length===0)loadKidsBooks();if(name==='adult'&&adultBooks.length===0)loadAdultBooks();}
async function xmlFetch(url){const r=await fetch(url);if(!r.ok){let msg='API 오류';try{const j=await r.json();msg=j.error||msg}catch(e){}throw new Error(msg)}const txt=await r.text();return new DOMParser().parseFromString(txt,'text/xml')}
async function searchBook(title){const xml=await xmlFetch(`/api/search-books?title=${encodeURIComponent(title)}`);const docs=xml.querySelectorAll('doc');const results=[];docs.forEach(d=>{const t=d.querySelector('title_info')?.textContent||'';const a=d.querySelector('author_info')?.textContent||'';const isbn=d.querySelector('isbn13')?.textContent||'';const pub=d.querySelector('publisher_info')?.textContent||'';if(isbn)results.push({title:t.trim(),author:a.trim(),isbn,pub:pub.trim()})});return results}
async function checkLib(isbn13,libCode){const xml=await xmlFetch(`/api/book-exist?isbn13=${encodeURIComponent(isbn13)}&libCode=${encodeURIComponent(libCode)}`);const hasBook=(xml.querySelector('hasBook')?.textContent||'N')==='Y';const loanAvailable=(xml.querySelector('loanAvailable')?.textContent||'N')==='Y';return hasBook&&loanAvailable}
async function fetchPopularByAge(fromAge,toAge,gender=''){let url=`/api/popular-books?from_age=${fromAge}&to_age=${toAge}`;if(gender)url+=`&gender=${gender==='F'?0:1}`;const xml=await xmlFetch(url);const docs=xml.querySelectorAll('doc');const books=[];docs.forEach(d=>{const title=d.querySelector('bookname')?.textContent||'';const author=d.querySelector('authors')?.textContent||'';const isbn=d.querySelector('isbn13')?.textContent||'';const pub=d.querySelector('publisher')?.textContent||'';if(isbn&&title)books.push({title:title.trim(),author:author.trim(),isbn,pub:pub.trim()})});return books}
function renderBookList(books,containerId,countId,btnId,storeArr){storeArr.length=0;books.forEach(b=>storeArr.push({...b,checked:false}));const container=document.getElementById(containerId),countEl=document.getElementById(countId),btnEl=document.getElementById(btnId);if(!books.length){container.innerHTML='<div class="err-box">인기도서를 불러오지 못했어요. Vercel 환경변수 LIBRARY_API_KEY를 확인해 주세요.</div>';return}btnEl.style.display='flex';function render(){container.innerHTML=storeArr.map((b,i)=>`<div class="book-item ${b.checked?'checked':''}" onclick="toggleBook(${i},'${containerId}','${countId}')"><div class="book-rank-num ${i<3?'top3':''}">${i+1}</div><div class="book-item-info"><div class="book-item-title">${escapeHtml(b.title)}</div><div class="book-item-author">${escapeHtml(b.author)}${b.pub?' · '+escapeHtml(b.pub):''}</div></div><div class="check-box">${b.checked?'✓':''}</div></div>`).join('');countEl.textContent=storeArr.filter(b=>b.checked).length+'권 선택'}window['_store_'+containerId]=storeArr;window['_render_'+containerId]=render;render()}
function toggleBook(i,containerId){const store=window['_store_'+containerId];store[i].checked=!store[i].checked;window['_render_'+containerId]()}
async function loadKidsBooks(){document.getElementById('kidsList').innerHTML='<div class="loading"><div class="spinner"></div>인기도서 불러오는 중...</div>';document.getElementById('kidsBtn').style.display='none';try{const [from,to]=kidsAge.split(',');const books=await fetchPopularByAge(from,to);renderBookList(books,'kidsList','kidsCount','kidsBtn',kidsBooks)}catch(e){document.getElementById('kidsList').innerHTML=`<div class="err-box">불러오기 실패: ${escapeHtml(e.message)}</div>`}}
function setKidsAge(el,age){kidsAge=age;document.querySelectorAll('.age-selector .pill').forEach(p=>p.classList.remove('active'));el.classList.add('active');kidsBooks=[];document.getElementById('kidsResult').innerHTML='';loadKidsBooks()}
async function loadAdultBooks(){document.getElementById('adultList').innerHTML='<div class="loading"><div class="spinner"></div>인기도서 불러오는 중...</div>';document.getElementById('adultBtn').style.display='none';try{const books=await fetchPopularByAge(20,59,adultGender);renderBookList(books,'adultList','adultCount','adultBtn',adultBooks)}catch(e){document.getElementById('adultList').innerHTML=`<div class="err-box">불러오기 실패: ${escapeHtml(e.message)}</div>`}}
function setGender(g){adultGender=g;document.getElementById('genderF').classList.toggle('active',g==='F');document.getElementById('genderM').classList.toggle('active',g==='M');adultBooks=[];document.getElementById('adultResult').innerHTML='';loadAdultBooks()}
async function searchCheckedBooks(type){const store=type==='kids'?kidsBooks:adultBooks;const resultId=type==='kids'?'kidsResult':'adultResult';const checked=store.filter(b=>b.checked);if(!checked.length){alert('책을 하나 이상 선택해 주세요.');return}await runLibrarySearch(checked,resultId)}
async function startDirectSearch(){const raw=document.getElementById('bookInput').value.trim();if(!raw){alert('책 제목을 입력해 주세요.');return}const titles=raw.split('\n').map(t=>t.trim()).filter(Boolean).slice(0,10);document.getElementById('searchBtn').disabled=true;document.getElementById('searchResult').innerHTML='<div class="loading"><div class="spinner"></div>책 제목 확인 중...</div>';const confirmedBooks=[];let html='<div class="card"><div class="step-badge">1단계 — 책 제목 확인</div><div class="section-title">검색된 도서 정보</div>';for(const title of titles){try{const results=await searchBook(title);if(!results.length){html+=`<div class="confirm-card"><div class="confirm-icon icon-err">✕</div><div class="confirm-info"><div class="confirm-title">${escapeHtml(title)}</div><div class="confirm-meta" style="color:var(--red)">검색 결과 없음</div></div></div>`}else{const best=results[0];confirmedBooks.push(best);html+=`<div class="confirm-card"><div class="confirm-icon icon-ok">✓</div><div class="confirm-info"><div class="confirm-title">${escapeHtml(best.title)}<span class="isbn-badge">ISBN ${best.isbn}</span></div><div class="confirm-meta">${escapeHtml(best.author)}${best.pub?' · '+escapeHtml(best.pub):''}</div></div></div>`}}catch(e){html+=`<div class="confirm-card"><div class="confirm-icon icon-err">!</div><div class="confirm-info"><div class="confirm-title">${escapeHtml(title)}</div><div class="confirm-meta" style="color:var(--red)">${escapeHtml(e.message)}</div></div></div>`}}html+='</div>';document.getElementById('searchResult').innerHTML=html;if(confirmedBooks.length)await runLibrarySearch(confirmedBooks,'searchResult');document.getElementById('searchBtn').disabled=false}
async function runLibrarySearch(books,resultContainerId){const container=document.getElementById(resultContainerId);container.innerHTML+='<div class="loading" id="libLoading"><div class="spinner"></div>18개 도서관 대출 가능 여부 확인 중...</div>';const matrix={};for(const b of books){matrix[b.isbn]={};for(const lib of LIBRARIES){try{matrix[b.isbn][lib.code]=await checkLib(b.isbn,lib.code)}catch(e){matrix[b.isbn][lib.code]=false}}}document.getElementById('libLoading')?.remove();let table=`<div class="card"><div class="step-badge">2단계 — 도서관 대출 가능 현황</div><div class="section-title">도서관별 대출 가능 여부</div><div class="tbl-wrap"><table><thead><tr><th class="left">책 제목</th>`;LIBRARIES.forEach(lib=>table+=`<th>${lib.name.replace('도서관','')}</th>`);table+='</tr></thead><tbody>';books.forEach(b=>{const short=b.title.length>16?b.title.slice(0,16)+'…':b.title;table+=`<tr><td class="left">${escapeHtml(short)}</td>`;LIBRARIES.forEach(lib=>table+=`<td>${matrix[b.isbn][lib.code]?'<span class="dot-y"></span>':'<span class="dot-n"></span>'}</td>`);table+='</tr>'});table+='</tbody></table></div></div>';container.innerHTML+=table;const scores=LIBRARIES.map(lib=>({name:lib.name,cnt:books.filter(b=>matrix[b.isbn][lib.code]).length})).sort((a,b)=>b.cnt-a.cnt).filter(l=>l.cnt>0);const max=scores.length?scores[0].cnt:0;let rank=`<div class="card"><div class="step-badge">3단계 — 도서관 순위</div><div class="section-title">내 책 목록을 가장 많이 바로 빌릴 수 있는 도서관</div><div class="rank-list">`;scores.forEach((s,i)=>{const pct=max?Math.round(s.cnt/max*100):0;rank+=`<div class="rank-row ${i===0?'top':''}"><div class="rank-num">${i+1}</div><div class="rank-name">${s.name}</div><div class="rank-bar-bg"><div class="rank-bar-fill" style="width:${pct}%"></div></div><div class="rank-count">${s.cnt}/${books.length}권</div></div>`});rank+='</div>';if(!scores.length)rank+='<div class="err-box">성남시 어느 도서관에도 지금 바로 대출 가능한 책이 없어요.</div>';else{const best=scores[0];rank+=`<div class="recommend-box">🏆 ${best.name}에 가면 ${books.length}권 중 ${best.cnt}권을 바로 빌릴 수 있어요.</div>`}rank+='</div>';container.innerHTML+=rank}
function resetSearch(){document.getElementById('bookInput').value='';document.getElementById('searchResult').innerHTML='';document.getElementById('searchBtn').disabled=false}
function escapeHtml(s){return String(s).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
</script>
</body>
</html>
